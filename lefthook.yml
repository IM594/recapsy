pre-commit:
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm turbo typecheck
    test:
      run: pnpm turbo test

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
