<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Recapsy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 20px;
        line-height: 1.4;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      .muted {
        opacity: 0.7;
        font-size: 13px;
      }
      section {
        margin-top: 18px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 6px 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        padding: 6px 10px;
      }
      input {
        min-width: 0;
        flex: 1 1 240px;
        padding: 6px 8px;
      }
      ul {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
      }
      li {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        margin: 6px 0;
      }
      .error {
        color: #b00020;
        margin-top: 8px;
      }
      .warn {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Recapsy</h1>
    <p class="muted">采集状态、同步队列与 macOS 权限引导。</p>

    <section>
      <h2>采集</h2>
      <div class="row"><span>状态</span><strong id="capture-state">—</strong></div>
      <div class="row"><span>是否暂停</span><strong id="capture-paused">—</strong></div>
      <div class="row"><span>准入</span><strong id="capture-admission">—</strong></div>
      <div class="row"><span>策略</span><strong id="capture-policy">—</strong></div>
      <div class="row"><span>最近错误</span><strong id="capture-error">无</strong></div>
      <div class="actions">
        <button id="pause" type="button">暂停</button>
        <button id="resume" type="button">继续</button>
      </div>
    </section>

    <section>
      <h2>本地隐私</h2>
      <p class="muted">
        被屏蔽应用的后续采集不会保存资源，也不会进入同步队列或 OCR 管线。
      </p>
      <div class="actions">
        <input
          id="privacy-bundle-id"
          aria-label="应用 Bundle Identifier"
          autocomplete="off"
          placeholder="com.example.SensitiveApp"
          spellcheck="false"
          type="text"
        />
        <button id="privacy-block-bundle" type="button">屏蔽应用</button>
      </div>
      <ul id="privacy-rules" aria-label="已屏蔽的应用"></ul>
    </section>

    <section>
      <h2>权限</h2>
      <div class="row"><span>屏幕录制</span><strong id="perm-screen">—</strong></div>
      <div class="row"><span>辅助功能</span><strong id="perm-ax">—</strong></div>
      <div id="permission-guide" class="warn" hidden></div>
      <div class="actions">
        <button id="request-screen" type="button">请求屏幕录制权限</button>
        <button id="open-screen" type="button">打开屏幕录制设置</button>
        <button id="open-ax" type="button">打开辅助功能设置</button>
        <button id="refresh-perms" type="button">刷新权限</button>
      </div>
    </section>

    <section>
      <h2>同步</h2>
      <div class="row"><span>每分钟接收</span><strong id="sync-input-rate">—</strong></div>
      <div class="row"><span>每分钟完成</span><strong id="sync-completed-rate">—</strong></div>
      <div class="row"><span>处理中</span><strong id="sync-processing">—</strong></div>
      <div class="row"><span>排队中（合计）</span><strong id="sync-pending">—</strong></div>
      <div class="row"><span>等待重试（计入合计）</span><strong id="sync-retrying">—</strong></div>
      <div class="row"><span>失败</span><strong id="sync-failed">—</strong></div>
      <div class="row"><span>已阻塞</span><strong id="sync-blocked">—</strong></div>
      <div class="row"><span>最老活跃任务</span><strong id="sync-oldest">—</strong></div>
      <div class="row"><span>工作线程</span><strong id="sync-workers">—</strong></div>
      <div class="row"><span>最近同步错误</span><strong id="sync-error">无</strong></div>
    </section>

    <section>
      <h2>本地存储</h2>
      <div class="row"><span>30 天复审</span><strong id="retention-preview">—</strong></div>
      <div class="actions">
        <button id="retention-clean" type="button">清理已复审资源</button>
      </div>
    </section>

    <p id="status" class="muted" role="status"></p>
    <p id="error" class="error" role="alert"></p>

    <script>
      const api = window.recapsyDesktop;
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const guideEl = document.getElementById('permission-guide');
      const pauseButton = document.getElementById('pause');
      const requestScreenButton = document.getElementById('request-screen');
      const resumeButton = document.getElementById('resume');
      const privacyBundleInput = document.getElementById('privacy-bundle-id');
      const privacyRules = document.getElementById('privacy-rules');
      const retentionCleanButton = document.getElementById('retention-clean');
      let screenRecordingRequestInFlight = false;
      let screenRecordingRequired = true;

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function permissionLabel(value) {
        if (value === 'granted') return '已授权';
        if (value === 'denied') return '已拒绝';
        if (value === 'not_determined') return '未决定';
        return '未知';
      }

      function captureStateLabel(value) {
        if (value === 'starting') return '启动中';
        if (value === 'running') return '运行中';
        if (value === 'paused') return '已暂停';
        if (value === 'stopping') return '停止中';
        if (value === 'stopped') return '已停止';
        return value || '—';
      }

      function formatBytes(value) {
        if (value < 1024) return `${value} B`;
        if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
        return `${(value / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatAge(seconds) {
        if (typeof seconds !== 'number') return '无';
        if (seconds < 60) return `${seconds} 秒`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟`;
        return `${Math.floor(seconds / 3600)} 小时`;
      }

      function formatPolicy(policy) {
        if (!policy) return '未应用';
        return `${policy.version} · ${policy.hash.slice(0, 15)}…`;
      }

      function renderPrivacyRules(rules) {
        privacyRules.replaceChildren();
        for (const rule of rules) {
          const item = document.createElement('li');
          const bundle = document.createElement('code');
          bundle.textContent = rule.bundleId;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = '移除';
          remove.addEventListener('click', async () => {
            try {
              await unwrap(api.captureRemoveLocalRule({ ruleId: rule.id }));
              await refreshAll();
            } catch (error) {
              errorEl.textContent = error.message || '无法移除本地隐私规则';
            }
          });
          item.append(bundle, remove);
          privacyRules.append(item);
        }
        if (rules.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'muted';
          empty.textContent = '暂无用户自定义屏蔽。';
          privacyRules.append(empty);
        }
      }

      function renderShellStatus(status) {
        setText('capture-state', captureStateLabel(status.captureState));
        setText(
          'capture-paused',
          status.capturePauseReason === 'storage'
            ? '存储保护'
            : status.capturePauseReason === 'backpressure'
              ? '追赶中'
            : status.capturePaused
              ? '已暂停'
              : '运行中',
        );
        setText(
          'capture-admission',
          status.capturePauseReason === 'storage'
            ? `存储保护（${(status.captureAdmission && status.captureAdmission.reasons.join(', ')) || '本地存储限额'}）`
            : status.captureAdmission && status.captureAdmission.active
            ? `追赶中（${status.captureAdmission.reasons.join(', ')}）`
            : '正在接收帧',
        );
        setText('capture-policy', formatPolicy(status.capturePolicy));
        setText('capture-error', status.lastErrorMessage || '无');
        setText('perm-screen', permissionLabel(status.screenRecording));
        setText('perm-ax', permissionLabel(status.accessibility));
        setText('sync-input-rate', String(status.syncInputPerMinute ?? 0));
        setText('sync-completed-rate', String(status.syncCompletedPerMinute ?? 0));
        setText('sync-processing', String(status.syncProcessing ?? 0));
        setText('sync-pending', String(status.syncPending));
        setText('sync-retrying', String(status.syncRetrying ?? 0));
        setText('sync-failed', String(status.syncFailed));
        setText('sync-blocked', String(status.syncBlocked ?? 0));
        setText('sync-oldest', formatAge(status.syncOldestActiveAgeSeconds));
        setText(
          'sync-workers',
          status.syncWorkerCapacity
            ? `${status.syncWorkerCapacity.activeWorkers} 活跃 · 服务端 ${status.syncWorkerCapacity.serverMaxConcurrentOcr} · 本机 ${status.syncWorkerCapacity.localMaxWorkers}`
            : '等待策略',
        );
        setText(
          'sync-error',
          status.syncLastErrorCode
            ? `${status.syncLastErrorCode}${status.syncLastErrorMessage ? ` · ${status.syncLastErrorMessage}` : ''}`
            : '无',
        );
        if (status.retentionPreview) {
          setText(
            'retention-preview',
            `${status.retentionPreview.eligibleAssets} 项 · ${formatBytes(status.retentionPreview.reclaimableBytes)}`,
          );
        }
        pauseButton.disabled = status.capturePaused;
        resumeButton.disabled = !status.capturePaused || status.capturePauseReason === 'backpressure';

        const needsScreen = status.screenRecording !== 'granted';
        const needsAx = status.accessibility !== 'granted';
        screenRecordingRequired = needsScreen;
        requestScreenButton.disabled = !needsScreen || screenRecordingRequestInFlight;
        if (needsScreen || needsAx) {
          guideEl.hidden = false;
          guideEl.textContent = needsScreen
            ? '需要屏幕录制权限。请先请求访问，让 macOS 注册 Recapsy；若此前被拒绝，请打开系统设置。完成后点刷新。'
            : '辅助功能对采集可选，但对上下文元数据必需。请打开系统设置，手动添加 Recapsy 并启用，然后刷新。';
        } else {
          guideEl.hidden = true;
        }
      }

      async function unwrap(promise) {
        const response = await promise;
        if (!response || !response.ok) {
          throw new Error((response && response.error && response.error.message) || '请求失败');
        }
        return response.data;
      }

      async function refreshAll() {
        errorEl.textContent = '';
        statusEl.textContent = '正在刷新…';
        const [capture, sync, permissions, retentionPreview, localRules] = await Promise.all([
          unwrap(api.captureGetStatus()),
          unwrap(api.syncGetSummary()),
          unwrap(api.permissionsGetStatus()),
          unwrap(api.diagnosticsPreviewRetention({ olderThanDays: 30 })),
          unwrap(api.captureListLocalRules()),
        ]);
        renderShellStatus({
          captureState: capture.state,
          capturePaused: capture.paused,
          capturePauseReason: capture.pauseReason,
          captureAdmission: capture.admission,
          capturePolicy: capture.policy,
          lastErrorMessage: capture.lastError && capture.lastError.message,
          screenRecording: permissions.screenRecording,
          accessibility: permissions.accessibility,
          syncPending: sync.pending,
          syncProcessing: sync.processing,
          syncRetrying: sync.retrying,
          syncFailed: sync.failed,
          syncBlocked: sync.blocked,
          syncInputPerMinute: sync.inputPerMinute,
          syncCompletedPerMinute: sync.completedPerMinute,
          syncOldestActiveAgeSeconds: sync.oldestActiveAgeSeconds,
          syncWorkerCapacity: sync.workerCapacity,
          syncLastErrorCode: sync.lastError && sync.lastError.code,
          syncLastErrorMessage: sync.lastError && sync.lastError.message,
          retentionPreview,
        });
        renderPrivacyRules(localRules.rules);
        statusEl.textContent = '已更新 ' + new Date().toLocaleTimeString();
      }

      document.getElementById('privacy-block-bundle').addEventListener('click', async () => {
        try {
          errorEl.textContent = '';
          const bundleId = privacyBundleInput.value.trim();
          await unwrap(api.captureBlockBundle({ bundleId }));
          privacyBundleInput.value = '';
          await refreshAll();
        } catch (error) {
          errorEl.textContent = error.message || '无法屏蔽应用';
        }
      });

      document.getElementById('pause').addEventListener('click', async () => {
        try {
          await unwrap(api.capturePause());
          await refreshAll();
        } catch (error) {
          errorEl.textContent = error.message || '暂停失败';
        }
      });

      document.getElementById('resume').addEventListener('click', async () => {
        try {
          await unwrap(api.captureResume());
          await refreshAll();
        } catch (error) {
          errorEl.textContent = error.message || '继续失败';
        }
      });

      retentionCleanButton.addEventListener('click', async () => {
        try {
          errorEl.textContent = '';
          retentionCleanButton.disabled = true;
          const result = await unwrap(api.diagnosticsRunRetention({ olderThanDays: 30 }));
          await refreshAll();
          statusEl.textContent = `已清理 ${result.cleanedAssets} 个资源`;
        } catch (error) {
          errorEl.textContent = error.message || '本地资源清理失败';
        } finally {
          retentionCleanButton.disabled = false;
        }
      });

      requestScreenButton.addEventListener('click', async () => {
        if (screenRecordingRequestInFlight) return;
        screenRecordingRequestInFlight = true;
        requestScreenButton.disabled = true;
        try {
          errorEl.textContent = '';
          statusEl.textContent = '正在请求屏幕录制权限…';
          const permissions = await unwrap(api.permissionsRequestScreenRecording());
          await refreshAll();
          statusEl.textContent = permissions.screenRecording === 'granted'
            ? '屏幕录制权限已启用。'
            : 'macOS 尚未授予权限。请打开屏幕录制设置，启用 Recapsy，然后刷新。';
        } catch (error) {
          errorEl.textContent = error.message || '无法请求屏幕录制权限';
          requestScreenButton.disabled = false;
        } finally {
          screenRecordingRequestInFlight = false;
          requestScreenButton.disabled = !screenRecordingRequired;
        }
      });

      document.getElementById('open-screen').addEventListener('click', async () => {
        try {
          await unwrap(api.permissionsOpenScreenRecordingSettings());
          statusEl.textContent = '已打开屏幕录制设置。请启用 Recapsy，然后刷新。';
        } catch (error) {
          errorEl.textContent = error.message || '无法打开设置';
        }
      });

      document.getElementById('open-ax').addEventListener('click', async () => {
        try {
          await unwrap(api.permissionsOpenAccessibilitySettings());
          statusEl.textContent =
            '已打开辅助功能设置。请用 + 添加 Recapsy，启用后再刷新。';
        } catch (error) {
          errorEl.textContent = error.message || '无法打开设置';
        }
      });

      document.getElementById('refresh-perms').addEventListener('click', async () => {
        try {
          await unwrap(api.permissionsRefresh());
          await refreshAll();
        } catch (error) {
          errorEl.textContent = error.message || '刷新失败';
        }
      });

      if (api.onStatusUpdated) {
        api.onStatusUpdated((status) => {
          renderShellStatus(status);
          statusEl.textContent = '实时更新 ' + new Date().toLocaleTimeString();
        });
      }

      refreshAll().catch((error) => {
        errorEl.textContent = error.message || '无法加载状态';
      });
    </script>
  </body>
</html>
