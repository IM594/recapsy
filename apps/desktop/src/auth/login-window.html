<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Recapsy Preview 登录</title>
  </head>
  <body>
    <!--
      Deliberately unstyled plain HTML/JS, no framework. This is a temporary,
      developer-facing sign-in form for the V0 Electron runtime — it exists
      only so `main/runtime.ts` has a real workspace id and
      real tokens to work with. It is not the product's sign-in UI; a future
      UI pass replaces this entirely. See docs/design/ELECTRON_MAIN_RUNTIME.md
      "非目标" and the desktop auth task notes.

      Security boundary: this page never calls `fetch` and never sees a
      token. It only calls `window.recapsyAuth.login(email, password)`,
      which the preload script (`login-preload.ts`) wires to the
      `auth.login` IPC channel. The real HTTP request and token storage
      happen entirely in the Electron main process.
    -->
    <h1>Recapsy Preview 登录（开发）</h1>
    <p>仅用于开发登录。无视觉设计；正式产品登录界面会替换本页。</p>
    <form id="login-form">
      <div>
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button id="submit" type="submit">登录</button>
      <p id="status" role="status"></p>
    </form>
    <script>
      const form = document.getElementById('login-form');
      const submitButton = document.getElementById('submit');
      const statusEl = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        submitButton.disabled = true;
        statusEl.textContent = '正在登录…';

        try {
          const response = await window.recapsyAuth.login(email, password);

          if (response && response.ok) {
            statusEl.textContent = '已登录。';
            return;
          }

          statusEl.textContent =
            (response && response.error && response.error.message) || '登录失败。';
        } catch (error) {
          statusEl.textContent = '登录失败。';
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
