name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify goal
        run: pnpm verify:goal

  server-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: recapsy_test
          POSTGRES_PASSWORD: recapsy_test_password
          POSTGRES_USER: recapsy_test
        options: >-
          --health-cmd "pg_isready -U recapsy_test -d recapsy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate PostgreSQL test database
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://recapsy_test:recapsy_test_password@localhost:5432/recapsy_test
        run: pnpm db:migrate

      - name: Verify PostgreSQL integration gates
        env:
          RECAPSY_TEST_DATABASE_URL: postgresql://recapsy_test:recapsy_test_password@localhost:5432/recapsy_test
        run: pnpm --filter @recapsy/server run test:postgres
