name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Test
        run: pnpm test

  desktop-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.10

      - name: Install libwebp
        run: brew install webp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test macOS capture and packaged layout
        env:
          RECAPSY_CAPTURE_SIGN_IDENTITY: "-"
        run: pnpm --filter @recapsy/desktop run test:macos
