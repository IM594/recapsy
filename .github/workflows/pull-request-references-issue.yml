name: Pull request references an issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read

jobs:
  issue-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Every referenced number is an open issue in this repository
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          numbers=$(grep -Eo '(^|[^A-Za-z0-9/])#[0-9]+' <<<"$BODY" | grep -Eo '[0-9]+' | sort -un)
          if [ -z "$numbers" ]; then
            echo "::error::The pull request body must reference an issue, for example 'Closes #12'."
            exit 1
          fi
          ok=0
          for n in $numbers; do
            state=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pull request" else .state end' 2>/dev/null || echo missing)
            case "$state" in
              open) echo "#$n is an open issue"; ok=1 ;;
              *) echo "::error::#$n is not an open issue in $REPO ($state)."; exit 1 ;;
            esac
          done
          [ "$ok" = 1 ]
